<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataPilot 启动画面</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #eef1ff;
    flex-direction: column;
    gap: 32px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  .window {
    width: 480px;
    height: 520px;
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    background: #f8f9fa;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.04),
      0 20px 60px rgba(79, 110, 247, 0.12),
      0 8px 24px rgba(0,0,0,0.06);
  }

  /* ── 抽象几何背景 ── */
  .splash-bg {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .splash-bg .orb {
    position: absolute;
    border-radius: 50%;
    opacity: 0.6;
  }

  .splash-bg .orb:nth-child(1) {
    width: 300px; height: 300px;
    background: linear-gradient(135deg, #eef1ff, #dce3ff);
    filter: blur(70px);
    top: -100px; right: -80px;
    animation: float1 8s ease-in-out infinite;
  }

  .splash-bg .orb:nth-child(2) {
    width: 220px; height: 220px;
    background: linear-gradient(135deg, #f0f4ff, #e8edff);
    filter: blur(60px);
    bottom: -60px; left: -80px;
    animation: float2 10s ease-in-out infinite;
  }

  .splash-bg .orb:nth-child(3) {
    width: 160px; height: 160px;
    background: linear-gradient(135deg, #eef1ff, #f8f0ff);
    filter: blur(50px);
    bottom: 100px; right: -40px;
    animation: float3 12s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(15px, 25px) scale(1.05); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-15px, -15px) scale(1.08); }
  }
  @keyframes float3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-25px, 15px) scale(1.1); }
  }

  /* ── 毛玻璃层 ── */
  .glass {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(20px) saturate(1.3);
    -webkit-backdrop-filter: blur(20px) saturate(1.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }

  /* ── Logo ── */
  .logo-wrap {
    position: relative;
    width: 84px;
    height: 84px;
  }

  .logo-ring {
    position: absolute;
    inset: -3px;
    border-radius: 22px;
    background: linear-gradient(135deg, #4f6ef7, #7c5cfc);
    opacity: 0.15;
    filter: blur(6px);
    animation: pulse-ring 2s ease-in-out infinite;
  }

  @keyframes pulse-ring {
    0%, 100% { opacity: 0.12; transform: scale(1); }
    50% { opacity: 0.25; transform: scale(1.06); }
  }

  .logo-box {
    position: relative;
    width: 84px;
    height: 84px;
    border-radius: 20px;
    background: linear-gradient(135deg, #4f6ef7 0%, #6c8aff 50%, #7c5cfc 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 8px 24px rgba(79, 110, 247, 0.25),
      inset 0 1px 0 rgba(255,255,255,0.25);
    overflow: hidden;
  }

  .logo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    padding: 14px;
    width: 100%;
    height: 100%;
  }

  .logo-grid .cell {
    border-radius: 3px;
    background: rgba(255,255,255,0.12);
    transition: all 0.3s;
  }

  .logo-grid .cell.active {
    background: rgba(255,255,255,0.92);
    box-shadow: 0 0 8px rgba(255,255,255,0.25);
  }

  .logo-grid .cell.highlight {
    background: rgba(255,255,255,0.45);
  }

  .cursor-icon {
    position: absolute;
    bottom: 15px;
    right: 15px;
    width: 18px;
    height: 18px;
  }

  .cursor-icon svg {
    width: 100%;
    height: 100%;
  }

  /* ── 文字 ── */
  .title {
    text-align: center;
  }

  .title h1 {
    font-size: 26px;
    font-weight: 700;
    color: #1a1a2e;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }

  .title p {
    font-size: 13px;
    color: #6b7280;
    font-weight: 400;
  }

  /* ── 加载 ── */
  .loader {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 3px solid #eef1ff;
    border-top-color: #4f6ef7;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loader-text {
    font-size: 13px;
    color: #6b7280;
    font-weight: 400;
  }

  /* ── 进度条 ── */
  .progress-track {
    width: 180px;
    height: 3px;
    border-radius: 4px;
    background: #eef1ff;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #4f6ef7, #7c5cfc);
    animation: progress 1.8s ease-in-out infinite;
  }

  @keyframes progress {
    0% { width: 0%; transform: translateX(0); }
    50% { width: 55%; transform: translateX(25%); }
    100% { width: 100%; transform: translateX(100%); }
  }

  .version {
    font-size: 12px;
    color: #9ca3af;
  }
</style>
</head>
<body>

<div class="window">
  <div class="splash-bg">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div class="glass">
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <div class="logo-box">
        <div class="logo-grid">
          <div class="cell active"></div>
          <div class="cell highlight"></div>
          <div class="cell"></div>
          <div class="cell active"></div>
          <div class="cell highlight"></div>
          <div class="cell active"></div>
          <div class="cell"></div>
          <div class="cell active"></div>
          <div class="cell highlight"></div>
        </div>
        <div class="cursor-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 3L19 14L13 15L15.5 21L12.5 22L10 16L5 19L5 3Z" fill="rgba(255,255,255,0.9)" />
          </svg>
        </div>
      </div>
    </div>

    <div class="title">
      <h1>DataPilot</h1>
      <p>自然语言驱动 · 智能表格处理</p>
    </div>

    <div class="loader">
      <div class="spinner"></div>
      <span class="loader-text">正在启动</span>
    </div>

    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>

    <div class="version">v0.3.6</div>
  </div>
</div>

<p style="color:#9ca3af;font-size:13px;">预览效果 · 点击软件后显示</p>

</body>
</html>
